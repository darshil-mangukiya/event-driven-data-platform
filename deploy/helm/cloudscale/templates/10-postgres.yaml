apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: cloudscale-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: cloudscale-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudscale-secrets, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: postgres-data, mountPath: /var/lib/postgresql/data}
            - {name: init-scripts, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "platform"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "platform"]}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init-scripts
          configMap: {name: postgres-init-scripts}
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
