apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudscale-config
  namespace: {{ .Values.namespace }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  DATABASE_URL: "postgresql://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPassword }}@postgres:5432/{{ .Values.config.postgresDb }}"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafkaBootstrapServers | quote }}
  KAFKA_CLIENT_ID: "data-platform-k8s"
  KAFKA_CONSUMER_GROUP: "processing-service"
  KAFKA_ENABLE_CONSUMER: "true"
  JWT_ISSUER: "platform.local"
  JWT_AUDIENCE: "data-platform"
  DEFAULT_CACHE_TTL_SECONDS: "120"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "120"
---
# Local-only placeholder credentials — see values.yaml's own comment and
# .env.example. Never a real secret for a real deployment; override
# `secrets.*` via --set or a separate, gitignored values file for
# anything beyond local kind demo use.
apiVersion: v1
kind: Secret
metadata:
  name: cloudscale-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
