apiVersion: apps/v1
kind: Deployment
metadata: {name: zookeeper, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: zookeeper}}
  template:
    metadata: {labels: {app: zookeeper}}
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          env:
            - {name: ZOOKEEPER_CLIENT_PORT, value: "2181"}
            - {name: ZOOKEEPER_TICK_TIME, value: "2000"}
          ports: [{containerPort: 2181}]
---
apiVersion: v1
kind: Service
metadata: {name: zookeeper, namespace: {{ .Values.namespace }}}
spec:
  selector: {app: zookeeper}
  ports: [{port: 2181, targetPort: 2181}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      # See deploy/kubernetes/base/12-kafka.yaml and
      # evidence/validation/kubernetes-verification.md for why this is
      # required because Kubernetes' auto-injected
      # KAFKA_PORT collides with the Confluent image's own env var).
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          env:
            - {name: KAFKA_BROKER_ID, value: "1"}
            - {name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092"}
            # Use the FQDN because KEDA runs in a separate namespace and Kafka
            # advertises this address back to clients after bootstrap.
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.{{ .Values.namespace }}.svc.cluster.local:9092"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
          ports: [{containerPort: 9092}]
          readinessProbe:
            exec: {command: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: {{ .Values.namespace }}}
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
  # The broker's controller reaches itself through this Service before the pod
  # becomes Ready, so not-ready endpoints must remain discoverable.
  publishNotReadyAddresses: true
