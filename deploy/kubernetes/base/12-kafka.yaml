apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: cloudscale
spec:
  replicas: 1
  selector: {matchLabels: {app: zookeeper}}
  template:
    metadata: {labels: {app: zookeeper}}
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          env:
            - {name: ZOOKEEPER_CLIENT_PORT, value: "2181"}
            - {name: ZOOKEEPER_TICK_TIME, value: "2000"}
          ports: [{containerPort: 2181}]
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: cloudscale
spec:
  selector: {app: zookeeper}
  ports: [{port: 2181, targetPort: 2181}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: cloudscale
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      # Kubernetes auto-injects a `KAFKA_PORT`
      # environment variable into every pod in the namespace for each
      # Service named "kafka" (Docker-links-style env injection,
      # `<SERVICE_NAME>_PORT`). The Confluent cp-kafka entrypoint script
      # also reads a legacy `KAFKA_PORT` variable, and the two collide —
      # the injected `tcp://10.x.x.x:9092` value is not a valid port
      # number, and the entrypoint exits silently right after its "port is
      # deprecated" warning with no further log output. Disabling
      # Kubernetes' service-link env injection for this pod is the
      # standard fix for this well-known Confluent-image-in-Kubernetes
      # interaction.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          env:
            - {name: KAFKA_BROKER_ID, value: "1"}
            - {name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092"}
            # Use the fully-qualified Service name because Kafka advertises
            # it to clients after bootstrap. KEDA runs in a separate namespace,
            # where the short service name does not resolve.
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.cloudscale.svc.cluster.local:9092"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
          ports: [{containerPort: 9092}]
          readinessProbe:
            exec: {command: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: cloudscale
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
  # The broker's controller reaches its advertised Service address during
  # bootstrap, before the readiness probe can succeed. Publish the endpoint
  # during that bootstrap cycle.
  publishNotReadyAddresses: true
