# Local-only placeholder credentials for the kind cluster demo — matches
# .env.example's checked-in placeholder values (POSTGRES_PASSWORD=platform,
# JWT_SECRET=local-development-secret-change-me). NEVER put real
# credentials in a checked-in Secret manifest; this file is a template,
# consistent with the *.example.yaml naming convention. Apply it as-is
# for local kind demo use, or generate a real Secret imperatively
# (`kubectl create secret generic ...`) for anything beyond that — never
# committed to Git.
apiVersion: v1
kind: Secret
metadata:
  name: cloudscale-secrets
  namespace: cloudscale
type: Opaque
stringData:
  POSTGRES_USER: "platform"
  POSTGRES_PASSWORD: "platform"
  JWT_SECRET: "local-development-secret-change-me"
