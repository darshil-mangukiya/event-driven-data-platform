version: 2

sources:
  - name: platform
    schema: public
    tables:
      - name: processed_orders
      - name: processed_payments
      - name: processed_user_sessions
      - name: tenant_metrics_daily
      - name: tenant_config
      - name: tenant_products

models:
  - name: stg_orders
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: net_revenue
        tests: [not_null]

  - name: stg_payments
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: payment_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["authorized", "captured", "failed", "refunded", "pending"]

  - name: fct_tenant_daily_metrics
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: metric_date
        tests: [not_null]
      - name: payment_failure_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: metricflow_time_spine
    description: Daily time spine required by dbt semantic metrics.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [not_null]
