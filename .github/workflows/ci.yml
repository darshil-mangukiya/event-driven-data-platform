name: data-platform-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: PYTHONPATH=.:services/shared pytest -q
      - name: Compile Python modules
        run: python -m compileall -q services scripts tests platform_cli examples kafka airflow
      - name: Contract and governance checks
        run: |
          PYTHONPATH=services/shared python scripts/validate_event_contracts.py
          PYTHONPATH=services/shared python scripts/check_contract_compatibility.py
          python scripts/validate_catalog.py
          PYTHONPATH=services/shared python scripts/validate_sample_artifacts.py
          python scripts/validate_privacy_catalog.py
          python scripts/schema_drift_report.py --pretty
          python scripts/validate_metric_contracts.py
          python scripts/validate_tenant_rls.py
          PYTHONPATH=. python scripts/validate_lineage.py
          PYTHONPATH=.:services/shared python scripts/validate_data_products.py
          PYTHONPATH=.:services/shared python scripts/validate_asyncapi.py
          PYTHONPATH=.:services/shared python scripts/validate_evidence_consistency.py --skip-test-count
      - name: Platform CLI smoke checks
        run: |
          PYTHONPATH=.:services/shared python -m platform_cli --pretty config validate
          PYTHONPATH=.:services/shared python -m platform_cli --pretty health check --dry-run
          PYTHONPATH=.:services/shared python -m platform_cli --pretty tenant validate --tenant-id tenant_demo --dry-run
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config
      - name: Validate service image build
        run: docker build -f docker/Dockerfile.service --build-arg SERVICE_PATH=services/analytics-service -t cloudscale-analytics-ci .

  infra-validate:
    # Tool-only validation; no live Compose infrastructure is started.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform fmt (target AWS architecture — validate only, no apply)
        run: cd infra/aws/terraform && terraform fmt -check -diff
      - name: Terraform validate
        run: cd infra/aws/terraform && terraform init -backend=false -input=false && terraform validate
      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"
      - name: Helm lint
        run: helm lint deploy/helm/cloudscale
      - name: Helm template (renders, does not deploy)
        run: helm template cloudscale deploy/helm/cloudscale > /dev/null
      - name: Validate Kubernetes manifests parse as YAML
        run: |
          python3 -c "
          import yaml, glob
          for path in glob.glob('deploy/kubernetes/base/*.yaml'):
              list(yaml.safe_load_all(open(path)))
              print('ok:', path)
          "
