spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key platform
spark.hadoop.fs.s3a.secret.key local-minio-secret-change-me
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.sql.sources.partitionOverwriteMode dynamic

# Structured Streaming (spark/streaming/streaming_job.py) needs the Kafka
# data source and the PostgreSQL JDBC driver. Declaring them here means
# `spark-submit spark/streaming/streaming_job.py` resolves them without
# needing --packages on the command line; override with --packages if you
# need a different Spark/Scala/driver version combination.
spark.jars.packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
